<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FIN 411 · Allocation</title>
  <style>
    :root {
      --purple: #4f2d7f;
      --purple-dark: #3a1f5e;
      --ink: #1a1523;
      --muted: #5c5566;
      --line: #e6e1ee;
      --bg: #f7f5fa;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .wrap {
      min-height: 100%;
      max-width: 26rem;
      margin: 0 auto;
      padding: 1.25rem 1.15rem calc(1.5rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .kicker {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--purple);
      font-weight: 650;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0.35rem 0 0.85rem;
      font-weight: 650;
    }
    p { margin: 0 0 0.75rem; }
    .muted { color: var(--muted); }
    .flip {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 0.9rem 1rem;
      margin: 0.5rem 0 1rem;
    }
    .flip strong { font-variant-numeric: tabular-nums; }
    .section-pick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin: 0.4rem 0 1.1rem;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .choice, .primary, .ghost {
      border-radius: 0.8rem;
      padding: 0.95rem 1rem;
      font-weight: 650;
      font-size: 1.05rem;
    }
    .section-pick button, .ghost {
      background: var(--card);
      border: 2px solid var(--line);
      color: var(--ink);
    }
    .section-pick button.selected,
    .primary {
      background: var(--purple);
      border: 2px solid var(--purple);
      color: #fff;
    }
    .primary {
      width: 100%;
      margin-top: auto;
    }
    .primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .progress {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.65rem;
    }
    .bar {
      height: 4px;
      background: var(--line);
      border-radius: 99px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--purple);
      width: 0%;
      transition: width 0.2s ease;
    }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.35rem; }
    .choice {
      width: 100%;
      background: var(--card);
      border: 2px solid var(--purple);
      color: var(--ink);
      text-align: left;
      padding: 1.05rem 1.1rem;
    }
    .choice-title {
      display: block;
      font-size: 1.2rem;
      font-weight: 650;
    }
    .choice-sub {
      display: block;
      margin-top: 0.3rem;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--muted);
    }
    .choice:disabled { opacity: 0.45; cursor: wait; }
    .q-prompt {
      font-size: 1.15rem;
      font-weight: 650;
      margin: 0 0 1rem;
    }
    .done {
      text-align: center;
      padding-top: 2.5rem;
    }
    .done h1 { margin-bottom: 0.5rem; }
    .a-block { margin: 1.35rem 0 1.15rem; }
    .a-caption {
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0;
    }
    .a-value {
      font-size: 3.4rem;
      font-weight: 650;
      color: var(--purple);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0.15rem 0 0.55rem;
    }
    .a-note {
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="wrap" id="app"></main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="store.js"></script>
  <script>
    const CFG = {
      n: 5,
      L0: 9300,
      H0: 13300,
      round: 50,
      submit: "/api/submit",
    };

    const state = {
      screen: "intro",
      section: null,
      L: CFG.L0,
      H: CFG.H0,
      step: 0,
      X: null,
      answers: [],
      busy: false,
      A: null,
    };

    function money(n) {
      return "$" + Math.round(n).toLocaleString("en-US");
    }

    function midpoint(L, H) {
      let x = Math.round((L + H) / 2 / CFG.round) * CFG.round;
      if (x <= L) x = L + CFG.round;
      if (x >= H) x = H - CFG.round;
      if (x <= L || x >= H) return null;
      return x;
    }

    function fromCE(ce) {
      const A = (11300 - ce) / 200;
      let y = A > 0 ? 2 / A : 2.5;
      y = Math.min(2.5, Math.max(0.15, y));
      return { A, y };
    }

    function formatA(A) {
      if (typeof A !== "number" || !Number.isFinite(A)) return "—";
      return (Math.round(A * 10) / 10).toFixed(1);
    }

    function render() {
      const root = document.getElementById("app");
      if (state.screen === "intro") {
        root.innerHTML = `
          <p>Which section are you in?</p>
          <div class="section-pick">
            <button type="button" data-sec="8:00"${state.section === "8:00" ? " class='selected'" : ""}>8:00 a.m.</button>
            <button type="button" data-sec="1:00"${state.section === "1:00" ? " class='selected'" : ""}>1:00 p.m.</button>
          </div>
          <h1>What would you prefer?</h1>
          <p>On January 1st, you have $10,000 that will be invested for 1 year in T-Bills earning <strong>5%</strong>. Assume no inflation. On December 31st, you will look at the balance.</p>
          <div class="flip">
            You are offered the chance to trade your investment for a coin flip:<br /><br />
            Heads: you get <strong>$13,300</strong> at the end of 1 year.<br />
            Tails: you get <strong>$9,300</strong> at the end of 1 year.
          </div>
          <button class="primary" id="start" ${state.section ? "" : "disabled"}>Start</button>
        `;
        root.querySelectorAll("[data-sec]").forEach((btn) => {
          btn.onclick = () => { state.section = btn.dataset.sec; render(); };
        });
        const start = document.getElementById("start");
        if (start) start.onclick = begin;
        return;
      }

      if (state.screen === "done") {
        root.innerHTML = `
          <div class="done">
            <div class="kicker">FIN 411</div>
            <h1>Thanks.</h1>
            <div class="a-block">
              <p class="a-caption">Your estimated <em>A</em></p>
              <div class="a-value">${formatA(state.A)}</div>
              <p class="a-note">Positive is risk-averse. Near zero is risk-neutral. Negative is risk-seeking.</p>
            </div>
            <p class="muted">You can put the phone down.</p>
          </div>
        `;
        return;
      }

      const pct = (state.step / CFG.n) * 100;
      root.innerHTML = `
        <div class="progress">Question ${state.step} of ${CFG.n}</div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <p class="q-prompt">What would you prefer?</p>
        <div class="actions">
          <button class="choice" data-pick="sure" ${state.busy ? "disabled" : ""}>
            <span class="choice-title">${money(state.X)} for sure</span>
            <span class="choice-sub">Paid December 31</span>
          </button>
          <button class="choice" data-pick="flip" ${state.busy ? "disabled" : ""}>
            <span class="choice-title">The coin flip</span>
            <span class="choice-sub">Heads $13,300 · Tails $9,300</span>
          </button>
        </div>
      `;
      root.querySelectorAll("[data-pick]").forEach((btn) => {
        btn.onclick = () => answer(btn.dataset.pick);
      });
    }

    function begin() {
      if (!state.section) return;
      state.L = CFG.L0;
      state.H = CFG.H0;
      state.step = 0;
      state.answers = [];
      state.A = null;
      nextX();
    }

    function nextX() {
      if (state.step >= CFG.n) return finish();
      const x = midpoint(state.L, state.H);
      if (x == null) return finish();
      state.X = x;
      state.step += 1;
      state.screen = "q";
      state.busy = false;
      render();
    }

    function answer(pick) {
      if (state.busy) return;
      state.busy = true;
      state.answers.push({ x: state.X, pick });
      if (pick === "sure") state.H = state.X;
      else state.L = state.X;
      render();
      setTimeout(nextX, 180);
    }

    async function finish() {
      const ce = (state.L + state.H) / 2;
      const { A, y } = fromCE(ce);
      state.A = A;
      state.screen = "done";
      render();
      const payload = {
        section: state.section,
        ce,
        A,
        y,
        answers: state.answers,
        t: Date.now(),
      };
      try {
        await Fin411Store.submitRow(payload);
      } catch (err) {
        /* still thank them */
      }
    }

    render();
  </script>
</body>
</html>
