<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FIN 411 · M&amp;Ms</title>
  <style>
    :root {
      --purple: #4f2d7f;
      --ink: #1a1523;
      --muted: #5c5566;
      --line: #e6e1ee;
      --bg: #f7f5fa;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .wrap {
      min-height: 100%;
      max-width: 26rem;
      margin: 0 auto;
      padding: 1.25rem 1.15rem calc(1.5rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0.35rem 0 0.75rem;
      font-weight: 650;
    }
    p { margin: 0 0 0.75rem; }
    .muted { color: var(--muted); }
    .section-pick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin: 0.4rem 0 1rem;
    }
    button { font: inherit; cursor: pointer; }
    .section-pick button {
      border-radius: 0.8rem;
      padding: 0.95rem 1rem;
      font-weight: 650;
      font-size: 1.05rem;
      background: var(--card);
      border: 2px solid var(--line);
      color: var(--ink);
    }
    .section-pick button.selected,
    .primary {
      background: var(--purple);
      border: 2px solid var(--purple);
      color: #fff;
    }
    .primary {
      width: 100%;
      margin-top: 0.85rem;
      border-radius: 0.8rem;
      padding: 0.95rem 1rem;
      font-weight: 650;
      font-size: 1.05rem;
    }
    .primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .rows { display: flex; flex-direction: column; gap: 0.55rem; }
    .row {
      display: grid;
      grid-template-columns: 1.6rem 5.2rem 1fr;
      gap: 0.65rem;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      padding: 0.45rem 0.7rem;
    }
    .swatch {
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.12);
    }
    .row label { font-weight: 650; }
    .row input {
      font: inherit;
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      padding: 0.4rem 0.5rem;
      text-align: right;
    }
    .total {
      margin-top: 0.75rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .warn { color: #9b1c1c; font-size: 0.9rem; margin-top: 0.35rem; }
    .done { text-align: center; padding-top: 2.5rem; }
    .done h1 { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <main class="wrap" id="app"></main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="store.js"></script>
  <script>
    const COLORS = [
      { id: "blue", label: "Blue", hex: "#1a73c7" },
      { id: "orange", label: "Orange", hex: "#ef7c00" },
      { id: "green", label: "Green", hex: "#3d8c2e" },
      { id: "yellow", label: "Yellow", hex: "#e6b800" },
      { id: "red", label: "Red", hex: "#c62828" },
      { id: "brown", label: "Brown", hex: "#5c3317" },
    ];

    const state = {
      screen: "form",
      section: null,
      counts: Object.fromEntries(COLORS.map((c) => [c.id, ""])),
    };

    function total() {
      return COLORS.reduce((s, c) => s + (parseInt(state.counts[c.id], 10) || 0), 0);
    }

    function filled() {
      return COLORS.every((c) => state.counts[c.id] !== "" && Number.isFinite(parseInt(state.counts[c.id], 10)));
    }

    function updateStatus() {
      const n = total();
      const tot = document.getElementById("tot");
      const warn = document.getElementById("warn");
      const go = document.getElementById("go");
      if (tot) tot.textContent = "Total: " + (filled() ? n : "—");
      if (warn) warn.hidden = !(filled() && n < 40);
      if (go) go.disabled = !(state.section && filled() && n >= 40);
    }

    function render() {
      const root = document.getElementById("app");
      if (state.screen === "done") {
        root.innerHTML = `
          <div class="done">
            <h1>Thanks.</h1>
            <p class="muted">You can put the phone down.</p>
          </div>`;
        return;
      }

      const rows = COLORS.map((c) => `
        <div class="row">
          <span class="swatch" style="background:${c.hex}"></span>
          <label for="${c.id}">${c.label}</label>
          <input id="${c.id}" type="number" inputmode="numeric" min="0" step="1"
            value="${state.counts[c.id]}" data-id="${c.id}" />
        </div>`).join("");

      root.innerHTML = `
        <p>Which section are you in?</p>
        <div class="section-pick">
          <button type="button" data-sec="8:00"${state.section === "8:00" ? " class='selected'" : ""}>8:00 a.m.</button>
          <button type="button" data-sec="1:00"${state.section === "1:00" ? " class='selected'" : ""}>1:00 p.m.</button>
        </div>
        <h1>Count your bag</h1>
        <p>Enter the number of each color. Use 0 if a color is missing. Count first; eat later.</p>
        <div class="rows">${rows}</div>
        <div class="total" id="tot">Total: —</div>
        <div class="warn" id="warn" hidden>A 1.69 oz bag is usually about 50–56. Check the count.</div>
        <button class="primary" id="go" disabled>Submit</button>
      `;
      root.querySelectorAll("[data-sec]").forEach((btn) => {
        btn.onclick = () => {
          state.section = btn.dataset.sec;
          root.querySelectorAll("[data-sec]").forEach((b) => b.classList.toggle("selected", b.dataset.sec === state.section));
          updateStatus();
        };
      });
      root.querySelectorAll("input[data-id]").forEach((inp) => {
        inp.oninput = () => { state.counts[inp.dataset.id] = inp.value; updateStatus(); };
      });
      document.getElementById("go").onclick = submit;
      updateStatus();
    }

    async function submit() {
      const counts = {};
      COLORS.forEach((c) => { counts[c.id] = parseInt(state.counts[c.id], 10) || 0; });
      const payload = { section: state.section, counts, total: total(), t: Date.now() };
      state.screen = "done";
      render();
      try {
        await Fin411Store.submitRow(payload);
      } catch (e) { /* still thank them */ }
    }

    render();
  </script>
</body>
</html>
